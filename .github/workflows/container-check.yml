name: Linux container check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [Dockerfile, .dockerignore, 'backend/**', 'deploy/**', 'requirements.txt', 'frontend/**', 'scripts/container_smoke.py', '.github/workflows/container-check.yml']
permissions:
  contents: read
jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build Linux image without private configuration
        run: docker build -t sketchless:check .
      - name: Check CAD, exports and persistent restart without Gemini
        env:
          SKETCHLESS_CHECK_MEMORY: 512m
          SKETCHLESS_CHECK_CPUS: '0.1'
        run: python scripts/container_smoke.py
      - name: Start isolated PostgreSQL for persistence integration
        run: |
          docker run -d --name sketchless-test-postgres -e POSTGRES_PASSWORD=offline-integration-password -p 127.0.0.1:5432:5432 postgres:17
          for attempt in $(seq 1 60); do
            if docker exec sketchless-test-postgres pg_isready -U postgres; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify PostgreSQL transactions and private artifact recovery
        run: |
          docker run --rm --network host --memory=512m --memory-swap=512m --cpus=0.1 \
            -e SKETCHLESS_TEST_POSTGRES=postgresql://postgres:offline-integration-password@127.0.0.1:5432/postgres \
            --mount type=bind,source="$PWD/tests",target=/app/tests,readonly \
            sketchless:check python -m pytest tests/test_cloud_postgres.py tests/test_cloud_storage.py -q -p no:cacheprovider
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-container-report
          path: container-report.json
